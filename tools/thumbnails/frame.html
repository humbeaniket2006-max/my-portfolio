<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One frame for every project tile. render.py fills #inner. */
:root{--bg:#FAF8F4;--surface:#fff;--ink:#1A1A1A;--muted:#5F5B54;--line:#E4DFD6;--accent:#23406B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:1080px;background:var(--bg);font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink)}
#frame{position:absolute;inset:32px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
#frame img.cover{width:100%;height:100%;object-fit:cover;display:block}
.mono{font-family:'DM Mono',ui-monospace,monospace}
/* typographic cover */
.type{width:100%;height:100%;background:var(--bg);padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
.type .num{font-family:'DM Mono',monospace;font-size:26px;color:var(--muted);letter-spacing:.04em}
.type h3{font-weight:600;font-size:128px;line-height:.98;letter-spacing:-.035em}
.type .big{font-weight:600;font-size:230px;line-height:.9;letter-spacing:-.04em;color:var(--accent)}
.type .big small{font-size:56px;letter-spacing:-.02em;color:var(--ink);margin-left:14px}
.type .rule{height:1px;background:var(--ink);margin:0 0 24px}
.type .tags{display:flex;gap:14px}
.type .tags span{font-family:'DM Mono',monospace;font-size:22px;border:1px solid var(--line);border-radius:4px;padding:8px 14px;color:var(--muted)}
/* 2x2 grid */
.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--line);width:100%;height:100%}
.grid4>div{position:relative;background:var(--bg);overflow:hidden}
.grid4 img{width:100%;height:100%;object-fit:cover;display:block}
.grid4 .cap{position:absolute;left:16px;bottom:14px;font-family:'DM Mono',monospace;font-size:20px;background:var(--bg);padding:4px 10px;border-radius:4px;border:1px solid var(--line)}
svg text{font-family:'DM Mono',monospace}
svg .d{font-family:'Hanken Grotesk',sans-serif}
</style></head>
<body><div id="frame"><div id="inner" style="width:100%;height:100%"></div></div></body></html>
